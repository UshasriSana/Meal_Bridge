<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div></div>
<h1 class="page-title">Donate Food</h1>

<div class="container">
  <form method="post" class="donor-form">

    <div class="form-group">
      <input type="text" name="hotel" placeholder="Hotel / Event Name" required>
    </div>

    <div class="form-group">
      <input type="number" name="quantity" placeholder="Food for how many people" required>
    </div>

    <div class="form-group">
      <select name="food_type">
        <option value="Veg">Veg</option>
        <option value="Non-Veg">Non-Veg</option>
      </select>
    </div>

    <div class="form-group">
      <input type="url" name="location" placeholder="Google Maps Link" required>
    </div>

    <div class="form-group">
      <input type="datetime-local" name="expiry" required>
    </div>

    <div class="form-group">
      <input type="tel" name="contact" placeholder="Contact Number" required>
    </div>

    <button type="submit" class="submit-btn">Submit Donation</button>

  </form>
</div>
